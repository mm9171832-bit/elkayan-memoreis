
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071b33">
<title>الكيان | ذكرياتنا</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#071b33;color:#fff}
header{text-align:center;padding:28px 14px;background:linear-gradient(135deg,#0d3150,#087f8c)}
h1{margin:0 0 8px;font-size:30px}
header p{margin:0;color:#d8f5f5}
main{max-width:850px;margin:auto;padding:16px}
.panel{background:#102943;padding:16px;border-radius:16px;margin-bottom:16px}
input,select,button{font:inherit;width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #34536d}
input,select{background:#071b33;color:white}
button{background:#08a6a6;color:white;border:0;font-weight:bold;cursor:pointer}
button.secondary{background:#294761}
button.danger{background:#b83d50}
.hidden{display:none!important}
.subject{background:#102943;border:1px solid #294761;padding:14px;border-radius:14px;margin:12px 0}
.subject h3{margin:0 0 10px}
.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.item{background:#071b33;padding:10px;border-radius:12px;overflow-wrap:anywhere}
.item img,.item video{width:100%;border-radius:8px;max-height:230px;object-fit:contain}
a{color:#66e4e4}
.small{font-size:13px;color:#c3d5e4}
#status{white-space:pre-wrap;line-height:1.7}
footer{text-align:center;padding:20px;color:#9fb7c9}
</style>
</head>
<body>
<header>
<h1>الكيان | ذكرياتنا</h1>
<p>ذكريات فصلنا في مكان واحد 💙</p>
</header>

<main>
<div class="panel">
<h3>📚 المواد الدراسية</h3>
<p class="small">اختار مادة عشان تشوف الصور والفيديوهات والملفات والروابط.</p>
<div id="status">جاري الاتصال بقاعدة البيانات...</div>
</div>

<div id="adminLogin" class="panel">
<h3>🔐 إدارة الموقع</h3>
<p class="small">اكتب كود الإدارة لإظهار أدوات الإضافة والحذف.</p>
<input id="adminCode" type="password" placeholder="كود الإدارة">
<button onclick="login()">دخول الإدارة</button>
</div>

<div id="adminPanel" class="panel hidden">
<h3>⚙️ إدارة المواد</h3>
<input id="subjectName" placeholder="اسم المادة الجديدة">
<button onclick="addSubject()">➕ إضافة مادة</button>
<hr>
<h3>إضافة محتوى لمادة</h3>
<select id="mediaSubject"></select>
<input id="mediaTitle" placeholder="عنوان الصورة أو الملف">
<select id="mediaKind">
<option value="image">صورة</option>
<option value="video">فيديو</option>
<option value="pdf">PDF</option>
<option value="link">رابط</option>
</select>
<input id="mediaFile" type="file" accept="image/*,video/*,.pdf">
<input id="mediaUrl" placeholder="رابط المحتوى (اختياري للملف، مطلوب للرابط)">
<button onclick="addMedia()">⬆️ إضافة المحتوى</button>
<button class="secondary" onclick="logout()">خروج من الإدارة</button>
</div>

<div id="subjects"></div>
</main>
<footer>الكيان | ذكرياتنا — أولى تاني</footer>

<script>
const SUPABASE_URL = "https://ptwqqxvdligohhotreac.supabase.co";
const SUPABASE_KEY = "sb_publishable_dlOf_WVqe3OMLPGXkM2w5Q_g_ERYO-q";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const BUCKET = "kayan-media";
let isAdmin = false;
let subjects = [];
let media = [];

const $ = id => document.getElementById(id);
function status(msg){ $("status").textContent = msg; }
function safe(text){
  return String(text ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function login(){
  if($("adminCode").value === "232850"){
    isAdmin = true;
    $("adminPanel").classList.remove("hidden");
    $("adminLogin").classList.add("hidden");
    render();
  }else{
    alert("كود الإدارة غير صحيح");
  }
}
function logout(){
  isAdmin = false;
  $("adminPanel").classList.add("hidden");
  $("adminLogin").classList.remove("hidden");
  render();
}
async function loadData(){
  status("جاري تحميل المواد...");
  const s = await db.from("subjects").select("*").order("id");
  if(s.error){
    status("فشل تحميل المواد: " + s.error.message +
      "\nتأكد من إعداد جدول subjects وصلاحيات القراءة في Supabase.");
    return;
  }
  subjects = s.data || [];
  const m = await db.from("media").select("*").order("id",{ascending:false});
  if(m.error){
    status("المواد اتصلت، لكن تحميل المحتوى فشل: " + m.error.message +
      "\nتأكد من إعداد جدول media وصلاحياته.");
    return;
  }
  media = m.data || [];
  status(subjects.length ? "تم تحميل الذكريات بنجاح 💙" : "الموقع جاهز، أضف أول مادة من إدارة الموقع.");
  render();
}
function render(){
  const select = $("mediaSubject");
  select.innerHTML = subjects.map(s =>
    `<option value="${s.id}">${safe(s.name)}</option>`).join("");
  $("subjects").innerHTML = subjects.map(s=>{
    const entries = media.filter(m=>String(m.subject_id)===String(s.id));
    return `<section class="subject">
      <h3>📘 ${safe(s.name)}</h3>
      ${isAdmin ? `<button class="danger" onclick="deleteSubject('${s.id}')">حذف المادة</button>` : ""}
      <div class="items">${entries.map(m=>{
        let content = "";
        if(m.kind==="image") content=`<img src="${safe(m.url)}" alt="${safe(m.title)}">`;
        else if(m.kind==="video") content=`<video controls src="${safe(m.url)}"></video>`;
        else if(m.kind==="pdf") content=`<a href="${safe(m.url)}" target="_blank" rel="noopener">📄 فتح ملف PDF</a>`;
        else content=`<a href="${safe(m.url)}" target="_blank" rel="noopener">🔗 فتح الرابط</a>`;
        return `<article class="item"><strong>${safe(m.title||"بدون عنوان")}</strong><p>${content}</p>
        ${isAdmin?`<button class="danger" onclick="deleteMedia('${m.id}')">حذف المحتوى</button>`:""}
        </article>`;
      }).join("")}</div>
      ${entries.length===0?'<p class="small">لسه مفيش ذكريات في المادة دي.</p>':""}
    </section>`;
  }).join("");
}
async function addSubject(){
  const name = $("subjectName").value.trim();
  if(!name) return alert("اكتب اسم المادة");
  const {error} = await db.from("subjects").insert({name});
  if(error) return alert("فشلت إضافة المادة: "+error.message);
  $("subjectName").value="";
  await loadData();
}
async function addMedia(){
  const subjectId = $("mediaSubject").value;
  const title = $("mediaTitle").value.trim();
  const kind = $("mediaKind").value;
  const file = $("mediaFile").files[0];
  let url = $("mediaUrl").value.trim();

  if(!subjectId) return alert("أضف مادة الأول");
  if(kind==="link" && !url) return alert("اكتب الرابط");
  if(kind!=="link" && !file && !url) return alert("اختار ملف أو اكتب رابطًا");

  if(file){
    const cleanName = file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
    const path = Date.now()+"_"+cleanName;
    const upload = await db.storage.from(BUCKET).upload(path,file,{upsert:false});
    if(upload.error) return alert("فشل رفع الملف: "+upload.error.message);
    url = db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
  }

  const {error} = await db.from("media").insert({
    subject_id: Number(subjectId),
    title: title || (file ? file.name : "رابط"),
    kind,
    url
  });
  if(error) return alert("فشلت إضافة المحتوى: "+error.message);
  $("mediaTitle").value="";
  $("mediaUrl").value="";
  $("mediaFile").value="";
  alert("تمت الإضافة بنجاح 💙");
  await loadData();
}
async function deleteMedia(id){
  if(!confirm("متأكد إنك عايز تحذف المحتوى ده؟")) return;
  const {error} = await db.from("media").delete().eq("id",id);
  if(error) return alert("فشل الحذف: "+error.message);
  await loadData();
}
async function deleteSubject(id){
  if(!confirm("حذف المادة وكل محتواها؟")) return;
  const {error: mediaError} = await db.from("media").delete().eq("subject_id",id);
  if(mediaError) return alert("فشل حذف محتوى المادة: "+mediaError.message);
  const {error} = await db.from("subjects").delete().eq("id",id);
  if(error) return alert("فشل حذف المادة: "+error.message);
  await loadData();
}
loadData();
</script>
</body>
</html>
